<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#18181b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- App Window Background -->
  <rect x="20" y="20" width="960" height="610" rx="12" fill="#1e1e24" stroke="#2e2e38" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title Bar -->
  <rect x="20" y="20" width="960" height="42" rx="12" fill="#18181e"/>
  <line x1="20" y1="62" x2="980" y2="62" stroke="#2e2e38" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="46" cy="41" r="6" fill="#ef4444"/>
  <circle cx="66" cy="41" r="6" fill="#f59e0b"/>
  <circle cx="86" cy="41" r="6" fill="#10b981"/>

  <text x="500" y="46" fill="#9ca3af" font-size="13" font-weight="500" text-anchor="middle">Obsidian — Settings &gt; Canvas Sync</text>

  <!-- Left Settings Navigation Pane -->
  <rect x="20" y="63" width="230" height="567" fill="#18181e"/>
  <line x1="250" y1="63" x2="250" y2="630" stroke="#2e2e38" stroke-width="1"/>

  <text x="40" y="96" fill="#6b7280" font-size="11" font-weight="600" letter-spacing="0.5">COMMUNITY PLUGINS</text>
  <text x="40" y="126" fill="#9ca3af" font-size="13">Dataview</text>
  <text x="40" y="154" fill="#9ca3af" font-size="13">Calendar</text>
  <rect x="30" y="166" width="210" height="30" rx="6" fill="#7c3aed" fill-opacity="0.25"/>
  <text x="40" y="186" fill="#a78bfa" font-size="13" font-weight="600">Canvas Sync</text>
  <text x="40" y="216" fill="#9ca3af" font-size="13">Templater</text>
  <text x="40" y="244" fill="#9ca3af" font-size="13">Omnisearch</text>

  <!-- Main Settings Body -->
  <text x="280" y="105" fill="#f9fafb" font-size="20" font-weight="700">Canvas Sync Settings</text>
  <text x="280" y="128" fill="#9ca3af" font-size="13">Configure your institution's Canvas LMS API connection and sync preferences.</text>

  <!-- Section 1: Connection -->
  <text x="280" y="168" fill="#a78bfa" font-size="14" font-weight="600">Canvas API Connection</text>

  <!-- Setting 1: Canvas Base URL -->
  <text x="280" y="196" fill="#f3f4f6" font-size="13" font-weight="500">Canvas Base URL</text>
  <text x="280" y="214" fill="#9ca3af" font-size="11">Your institution's Canvas domain (e.g., https://canvas.university.edu)</text>
  <rect x="640" y="186" width="310" height="32" rx="5" fill="#141418" stroke="#373746" stroke-width="1"/>
  <text x="652" y="207" fill="#e5e7eb" font-size="12">https://sandiego.instructure.com</text>

  <line x1="280" y1="230" x2="950" y2="230" stroke="#2a2a36" stroke-width="1"/>

  <!-- Setting 2: Canvas API Token -->
  <text x="280" y="256" fill="#f3f4f6" font-size="13" font-weight="500">Canvas API Access Token</text>
  <text x="280" y="274" fill="#9ca3af" font-size="11">Generated via Canvas: Account &gt; Settings &gt; + New Access Token</text>
  <rect x="640" y="246" width="310" height="32" rx="5" fill="#141418" stroke="#373746" stroke-width="1"/>
  <text x="652" y="267" fill="#8b5cf6" font-size="12">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</text>

  <line x1="280" y1="290" x2="950" y2="290" stroke="#2a2a36" stroke-width="1"/>

  <!-- Section 2: Sync Options -->
  <text x="280" y="325" fill="#a78bfa" font-size="14" font-weight="600">Content Synchronization Options</text>

  <!-- Setting 3: Discussion Replies -->
  <text x="280" y="352" fill="#f3f4f6" font-size="13" font-weight="500">Sync Discussion Board Replies</text>
  <text x="280" y="370" fill="#9ca3af" font-size="11">Download full multi-level discussion reply trees and student responses</text>
  <!-- Toggle ON -->
  <rect x="895" y="348" width="44" height="24" rx="12" fill="#7c3aed"/>
  <circle cx="927" cy="360" r="9" fill="#ffffff"/>

  <line x1="280" y1="386" x2="950" y2="386" stroke="#2a2a36" stroke-width="1"/>

  <!-- Setting 4: Student Submissions & Grades -->
  <text x="280" y="412" fill="#f3f4f6" font-size="13" font-weight="500">Sync Student Submissions &amp; Rubrics</text>
  <text x="280" y="430" fill="#9ca3af" font-size="11">Download your submitted files, assignment scores, and teacher comments</text>
  <!-- Toggle ON -->
  <rect x="895" y="408" width="44" height="24" rx="12" fill="#7c3aed"/>
  <circle cx="927" cy="420" r="9" fill="#ffffff"/>

  <line x1="280" y1="446" x2="950" y2="446" stroke="#2a2a36" stroke-width="1"/>

  <!-- Section 3: File & Asset Downloader -->
  <text x="280" y="480" fill="#a78bfa" font-size="14" font-weight="600">Asset &amp; Document Downloads</text>

  <!-- Setting 5: Allowed Extensions -->
  <text x="280" y="506" fill="#f3f4f6" font-size="13" font-weight="500">Allowed File Extensions</text>
  <text x="280" y="524" fill="#9ca3af" font-size="11">Comma-separated list of extensions to download locally</text>
  <rect x="640" y="496" width="310" height="32" rx="5" fill="#141418" stroke="#373746" stroke-width="1"/>
  <text x="652" y="517" fill="#e5e7eb" font-size="12">pdf, docx, pptx, xlsx, png, jpg, zip</text>

  <line x1="280" y1="540" x2="950" y2="540" stroke="#2a2a36" stroke-width="1"/>

  <!-- Setting 6: Max Asset Size -->
  <text x="280" y="566" fill="#f3f4f6" font-size="13" font-weight="500">Max Asset Size (MB)</text>
  <text x="280" y="584" fill="#9ca3af" font-size="11">Skip single files larger than this threshold</text>
  <rect x="860" y="556" width="90" height="32" rx="5" fill="#141418" stroke="#373746" stroke-width="1"/>
  <text x="895" y="577" fill="#e5e7eb" font-size="12">50 MB</text>
</svg>

