<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#18181b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- App Window Background -->
  <rect x="20" y="20" width="960" height="610" rx="12" fill="#1e1e24" stroke="#2e2e38" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title Bar -->
  <rect x="20" y="20" width="960" height="42" rx="12" fill="#18181e"/>
  <rect x="20" y="50" width="960" height="12" fill="#18181e"/>
  <line x1="20" y1="62" x2="980" y2="62" stroke="#2e2e38" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="46" cy="41" r="6" fill="#ef4444"/>
  <circle cx="66" cy="41" r="6" fill="#f59e0b"/>
  <circle cx="86" cy="41" r="6" fill="#10b981"/>

  <text x="500" y="46" fill="#9ca3af" font-size="13" font-weight="500" text-anchor="middle">Obsidian — Academic Vault</text>

  <!-- Left Sidebar (Vault Navigation) -->
  <rect x="20" y="63" width="220" height="567" fill="#18181e"/>
  <line x1="240" y1="63" x2="240" y2="630" stroke="#2e2e38" stroke-width="1"/>

  <!-- Ribbon Icons -->
  <rect x="20" y="63" width="44" height="567" fill="#141418"/>
  <line x1="64" y1="63" x2="64" y2="630" stroke="#2e2e38" stroke-width="1"/>

  <!-- Graduation Cap Ribbon Active -->
  <rect x="26" y="80" width="32" height="32" rx="6" fill="#7c3aed" fill-opacity="0.25"/>
  <path d="M42 88 L52 93 L42 98 L32 93 Z M36 96.5 V102 C36 104.5 48 104.5 48 102 V96.5" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <path d="M50 94 V101" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>

  <!-- File Tree Sidebar Text -->
  <text x="76" y="95" fill="#6b7280" font-size="11" font-weight="600" letter-spacing="0.5">VAULT EXPLORER</text>
  <text x="76" y="125" fill="#d1d5db" font-size="13" font-weight="500">📁 Canvas</text>
  <text x="92" y="152" fill="#9ca3af" font-size="12">📁 CS-101 - Intro to CS</text>
  <text x="108" y="177" fill="#6b7280" font-size="12">📄 Course.md</text>
  <text x="108" y="200" fill="#6b7280" font-size="12">📄 Home.md</text>
  <text x="108" y="223" fill="#6b7280" font-size="12">📄 Grades.md</text>
  <text x="108" y="246" fill="#6b7280" font-size="12">📄 Tasks.md</text>
  <text x="92" y="276" fill="#9ca3af" font-size="12">📁 CS-350 - Software Arch</text>

  <!-- Modal Backdrop -->
  <rect x="240" y="63" width="740" height="567" fill="#000000" fill-opacity="0.55"/>

  <!-- Course Selector Modal Dialog -->
  <rect x="340" y="110" width="540" height="470" rx="10" fill="#1e1e24" stroke="#3f3f4e" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Modal Header -->
  <text x="370" y="150" fill="#f3f4f6" font-size="18" font-weight="700">Select Courses to Sync</text>
  <text x="370" y="172" fill="#9ca3af" font-size="13">Choose which Canvas LMS courses to sync directly into your vault.</text>

  <!-- Select All / Deselect All Controls -->
  <rect x="370" y="195" width="85" height="28" rx="5" fill="#2e2e38"/>
  <text x="412" y="213" fill="#e5e7eb" font-size="12" font-weight="500" text-anchor="middle">Select All</text>

  <rect x="465" y="195" width="95" height="28" rx="5" fill="#2e2e38"/>
  <text x="512" y="213" fill="#9ca3af" font-size="12" font-weight="500" text-anchor="middle">Deselect All</text>

  <!-- Course Item 1 (Selected) -->
  <rect x="370" y="238" width="480" height="66" rx="8" fill="#272730" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="386" y="261" width="20" height="20" rx="4" fill="#7c3aed"/>
  <polyline points="391,271 396,276 402,266" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="420" y="265" fill="#f9fafb" font-size="14" font-weight="600">CS-101 - Introduction to Computer Science</text>
  <text x="420" y="287" fill="#a78bfa" font-size="12">CS-101-01</text>
  <rect x="735" y="259" width="100" height="22" rx="4" fill="#312e81"/>
  <text x="785" y="274" fill="#c7d2fe" font-size="11" font-weight="500" text-anchor="middle">Fall 2026</text>

  <!-- Course Item 2 (Selected) -->
  <rect x="370" y="314" width="480" height="66" rx="8" fill="#272730" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="386" y="337" width="20" height="20" rx="4" fill="#7c3aed"/>
  <polyline points="391,347 396,352 402,342" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="420" y="341" fill="#f9fafb" font-size="14" font-weight="600">CS-350 - Software Architecture &amp; Design</text>
  <text x="420" y="363" fill="#a78bfa" font-size="12">CS-350-02</text>
  <rect x="735" y="335" width="100" height="22" rx="4" fill="#312e81"/>
  <text x="785" y="350" fill="#c7d2fe" font-size="11" font-weight="500" text-anchor="middle">Fall 2026</text>

  <!-- Course Item 3 (Unselected) -->
  <rect x="370" y="390" width="480" height="66" rx="8" fill="#23232b" stroke="#333340" stroke-width="1"/>
  <rect x="386" y="413" width="20" height="20" rx="4" fill="#18181e" stroke="#4b5563" stroke-width="1.5"/>
  <text x="420" y="417" fill="#9ca3af" font-size="14" font-weight="500">ENG-101 - Academic Writing</text>
  <text x="420" y="439" fill="#6b7280" font-size="12">ENG-101-04</text>
  <rect x="735" y="411" width="100" height="22" rx="4" fill="#282834"/>
  <text x="785" y="426" fill="#9ca3af" font-size="11" font-weight="500" text-anchor="middle">Spring 2026</text>

  <!-- Modal Footer Buttons -->
  <line x1="340" y1="480" x2="880" y2="480" stroke="#2e2e38" stroke-width="1"/>
  
  <rect x="610" y="505" width="85" height="38" rx="6" fill="#2e2e38"/>
  <text x="652" y="529" fill="#d1d5db" font-size="13" font-weight="500" text-anchor="middle">Cancel</text>

  <rect x="705" y="505" width="150" height="38" rx="6" fill="url(#purpleGrad)"/>
  <text x="780" y="529" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Sync Selected (2)</text>
</svg>

