name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type check browser extension
        run: npx tsc -p apps/browser-extension/tsconfig.json --noEmit

      - name: Type check Obsidian plugin
        run: npx tsc -p apps/obsidian-plugin/tsconfig.json --noEmit

      - name: Build all targets (Obsidian plugin, Chrome & Firefox extensions)
        run: npm run build

      - name: Lint Firefox extension (web-ext)
        run: npm run lint:extension

      - name: Validate extension outputs and manifests (Chrome & Firefox)
        run: npm run validate:extension

      - name: Package extension releases (smoke test packaging)
        run: npm run package:extension
