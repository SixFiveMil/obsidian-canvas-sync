name: CI

on:
  push:
    branches:
      - dev
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type check Obsidian plugin
        run: npm run typecheck

      - name: Build Obsidian plugin
        run: npm run build

      - name: Validate with Obsidian official workflow
        uses: obsidianmd/obsidian-workflows@v1
        with:
          mode: pr
          scanner-lint: 'true'
