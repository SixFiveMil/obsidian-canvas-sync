name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to package and publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-validate-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches Obsidian plugin version
        run: |
          node -e "const fs = require('fs'); const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); if (manifest.version !== process.env.RELEASE_TAG) { console.error('Tag (' + process.env.RELEASE_TAG + ') does not match manifest.json version (' + manifest.version + ')'); process.exit(1); }"

      - name: Run unit tests
        run: npm test

      - name: Type check Obsidian plugin
        run: npm run typecheck

      - name: Validate, attest, and draft release with Obsidian official workflow
        uses: obsidianmd/obsidian-workflows@v1
        with:
          mode: release
          scanner-lint: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}