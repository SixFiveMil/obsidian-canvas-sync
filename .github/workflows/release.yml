name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to package and publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches Obsidian plugin version
        run: |
          node -e "const fs = require('fs'); const manifest = JSON.parse(fs.readFileSync('apps/obsidian-plugin/manifest.json', 'utf8')); if (manifest.version !== process.env.RELEASE_TAG) { console.error('Tag (' + process.env.RELEASE_TAG + ') does not match apps/obsidian-plugin/manifest.json version (' + manifest.version + ')'); process.exit(1); }"

      - name: Run unit tests
        run: npm test

      - name: Type check Obsidian plugin
        run: npm run typecheck

      - name: Build Obsidian plugin
        run: npm run build

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp apps/obsidian-plugin/manifest.json release/manifest.json
          cp apps/obsidian-plugin/main.js release/main.js

          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            function getHash(p) { return crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex'); }
            const mainHash = getHash('release/main.js');
            const manifestHash = getHash('release/manifest.json');
            let current = mainHash + '  main.js\n' + manifestHash + '  manifest.json\n';
            fs.writeFileSync('release/checksums.txt', current, 'utf8');
            console.log('Final checksums:\n' + current);
          "

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/main.js
            release/manifest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release/manifest.json
            release/main.js
            release/checksums.txt

      - name: Verify uploaded release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > release.json

          node -e "
            const fs = require('fs');
            const rel = JSON.parse(fs.readFileSync('release.json', 'utf8'));
            const assets = rel.assets || [];
            const required = ['manifest.json', 'main.js', 'checksums.txt'];
            const byName = new Map(assets.map(a => [a.name, a]));
            const missing = required.filter(name => !byName.has(name));
            if (missing.length > 0) {
              console.error('Missing release assets: ' + missing.join(', '));
              process.exit(1);
            }
            const empty = required.filter(name => (byName.get(name)?.size || 0) <= 0);
            if (empty.length > 0) {
              console.error('Release assets have zero size: ' + empty.join(', '));
              process.exit(1);
            }
            console.log('Verified all required release assets: ' + required.join(', '));
          "