name: Deploy Browser Extensions

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target extension to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - chrome
          - firefox
      auto_publish:
        description: "Submit Chrome extension for review / Auto-publish"
        required: true
        default: true
        type: boolean
      amo_channel:
        description: "Firefox AMO distribution channel"
        required: true
        default: "listed"
        type: choice
        options:
          - listed
          - unlisted

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check browser extension
        run: npx tsc -p apps/browser-extension/tsconfig.json --noEmit

      - name: Build extensions
        run: node apps/browser-extension/build.mjs ${{ github.event.inputs.target }}

      - name: Lint Firefox extension
        if: ${{ github.event.inputs.target == 'firefox' || github.event.inputs.target == 'all' }}
        run: npm run lint:extension

      - name: Validate extension outputs
        run: node apps/browser-extension/scripts/validate-dist.mjs ${{ github.event.inputs.target }}

      - name: Package extension archives
        run: node apps/browser-extension/scripts/package.mjs ${{ github.event.inputs.target }} --out-dir release

      - name: Deploy to store(s)
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          CWS_PUBLISH: ${{ github.event.inputs.auto_publish }}
        run: |
          PUBLISH_FLAG=""
          if [ "${{ github.event.inputs.auto_publish }}" = "true" ]; then
            PUBLISH_FLAG="--publish"
          fi
          node apps/browser-extension/scripts/publish-stores.mjs ${{ github.event.inputs.target }} ${PUBLISH_FLAG} --channel=${{ github.event.inputs.amo_channel }}

